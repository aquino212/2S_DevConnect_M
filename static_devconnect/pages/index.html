<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login - DevConnect</title>
   <link rel="stylesheet" href="../assets/styles/login.css">
</head>

<body>

   <main id="login-main">

      <section class="login-container">

         <img src="../assets/images/logo-devconnect-lg.svg" alt="Logo DevConnect" class="logo-img">

         <p class="login-texto">
            Acesse sua conta para continuar
         </p>

         <form class="login-form">

            <div class="login-campo">
               <label for="usuario">Nome de usuário</label>
               <input type="text" id="usuario" placeholder="Digite seu nome de usuário">
            </div>

            <div class="login-campo">
               <label for="senha">Senha</label>
               <input type="password" id="senha" placeholder="Digite sua senha">
            </div>

            <button type="submit">Entrar</button>

         </form>

         <a href="#" class="esqueceu-senha">Esqueceu a senha?</a>

      </section>

      <section class="cadastro-container-bottom">
         <p>Não tem uma conta? <a href="../pages/TelaCadastro.html">Cadastre-se</a></p>
         <a href="aula1.html" class="voltar-link">Voltar ao Início</a>
      </section>

   </main>

</body>
</html>
